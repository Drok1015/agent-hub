<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Hub - 管理后台</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222632;
    --border: #2a2e3a;
    --text: #e4e6eb;
    --text-muted: #8b8fa3;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --green: #00b894;
    --red: #e17055;
    --yellow: #fdcb6e;
    --blue: #74b9ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Login */
  .login-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 400px;
    max-width: 90vw;
  }
  .login-box h1 {
    font-size: 24px;
    margin-bottom: 8px;
  }
  .login-box p {
    color: var(--text-muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .login-box input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .login-box button:hover { opacity: 0.9; }
  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  /* Layout */
  .app { display: none; }
  .app.active { display: block; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .actions { display: flex; gap: 12px; align-items: center; }
  header .actions span {
    color: var(--text-muted);
    font-size: 13px;
  }
  header .actions button {
    padding: 6px 14px;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  header .actions button:hover { border-color: var(--accent); }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .stat-card .label {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .stat-card .value {
    font-size: 28px;
    font-weight: 700;
  }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.blue { color: var(--blue); }
  .stat-card .value.yellow { color: var(--yellow); }
  .stat-card .value.accent { color: var(--accent-light); }

  /* Section */
  .section { margin-bottom: 32px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-header h2 { font-size: 16px; font-weight: 600; }

  /* Agent Cards */
  .agent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .agent-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    transition: border-color 0.2s;
  }
  .agent-card:hover { border-color: var(--accent); }
  .agent-card .agent-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .agent-card .agent-name {
    font-size: 15px;
    font-weight: 600;
  }
  .status-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .status-badge.online {
    background: rgba(0, 184, 148, 0.15);
    color: var(--green);
  }
  .status-badge.offline {
    background: rgba(139, 143, 163, 0.15);
    color: var(--text-muted);
  }
  .agent-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .capabilities {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cap-tag {
    padding: 2px 8px;
    background: rgba(108, 92, 231, 0.15);
    color: var(--accent-light);
    border-radius: 4px;
    font-size: 12px;
  }

  /* Task Table */
  .task-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .task-table th {
    text-align: left;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-hover);
  }
  .task-table td {
    padding: 12px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .task-table tr:last-child td { border-bottom: none; }
  .task-table tr:hover td { background: var(--surface-hover); }
  .task-status {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }
  .task-status.pending { background: rgba(253, 203, 110, 0.15); color: var(--yellow); }
  .task-status.assigned { background: rgba(116, 185, 255, 0.15); color: var(--blue); }
  .task-status.running { background: rgba(108, 92, 231, 0.15); color: var(--accent-light); }
  .task-status.completed { background: rgba(0, 184, 148, 0.15); color: var(--green); }
  .task-status.failed { background: rgba(225, 112, 85, 0.15); color: var(--red); }
  .task-status.cancelled { background: rgba(139, 143, 163, 0.15); color: var(--text-muted); }

  .empty-state {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Messages */
  .msg-list { max-height: 400px; overflow-y: auto; }
  .msg-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .msg-item:last-child { border-bottom: none; }
  .msg-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .msg-from { color: var(--accent-light); font-weight: 500; }
  .msg-time { color: var(--text-muted); font-size: 12px; }
  .msg-content { color: var(--text-muted); }

  @media (max-width: 768px) {
    header { padding: 12px 16px; }
    .container { padding: 16px; }
    .agent-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>Agent Hub</h1>
    <p>输入管理员 Token 登录管理后台</p>
    <input type="password" id="tokenInput" placeholder="Bearer Token" autofocus>
    <button onclick="doLogin()">登录</button>
    <div class="login-error" id="loginError">认证失败，请检查 Token</div>
  </div>
</div>

<!-- Dashboard -->
<div class="app" id="app">
  <header>
    <h1>Agent Hub</h1>
    <div class="actions">
      <span id="lastUpdate"></span>
      <button onclick="refresh()">刷新</button>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="container">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">Agent 总数</div>
        <div class="value accent" id="statTotal">-</div>
      </div>
      <div class="stat-card">
        <div class="label">在线 Agent</div>
        <div class="value green" id="statOnline">-</div>
      </div>
      <div class="stat-card">
        <div class="label">任务总数</div>
        <div class="value blue" id="statTasks">-</div>
      </div>
      <div class="stat-card">
        <div class="label">进行中任务</div>
        <div class="value yellow" id="statRunning">-</div>
      </div>
    </div>

    <!-- Agents -->
    <div class="section">
      <div class="section-header">
        <h2>Agent 列表</h2>
      </div>
      <div class="agent-grid" id="agentGrid">
        <div class="empty-state">加载中...</div>
      </div>
    </div>

    <!-- Tasks -->
    <div class="section">
      <div class="section-header">
        <h2>任务列表</h2>
      </div>
      <div id="taskContainer">
        <div class="empty-state">加载中...</div>
      </div>
    </div>

    <!-- Messages -->
    <div class="section">
      <div class="section-header">
        <h2>最近消息</h2>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
        <div class="msg-list" id="msgList">
          <div class="empty-state">加载中...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('agent_hub_token') || '';
let refreshTimer = null;

const API = '';

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) throw new Error('UNAUTHORIZED');
  return res.json();
}

function doLogin() {
  TOKEN = document.getElementById('tokenInput').value.trim();
  if (!TOKEN) return;
  localStorage.setItem('agent_hub_token', TOKEN);
  loadDashboard();
}

function doLogout() {
  TOKEN = '';
  localStorage.removeItem('agent_hub_token');
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginOverlay').style.display = 'flex';
  if (refreshTimer) clearInterval(refreshTimer);
}

async function loadDashboard() {
  try {
    await api('/api/v1/agents');
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').classList.add('active');
    await refresh();
    refreshTimer = setInterval(refresh, 30000);
  } catch (e) {
    document.getElementById('loginError').style.display = 'block';
    TOKEN = '';
    localStorage.removeItem('agent_hub_token');
  }
}

async function refresh() {
  try {
    const [agentsRes, tasksRes, msgsRes] = await Promise.all([
      api('/api/v1/agents'),
      api('/api/v1/tasks?limit=50'),
      api('/api/v1/messages?limit=20'),
    ]);

    const agentList = agentsRes.data || [];
    const taskList = tasksRes.data || [];
    const msgList = msgsRes.data || [];

    // Stats
    const online = agentList.filter(a => a.status === 'online').length;
    const running = taskList.filter(t => t.status === 'running' || t.status === 'assigned').length;
    document.getElementById('statTotal').textContent = agentList.length;
    document.getElementById('statOnline').textContent = online;
    document.getElementById('statTasks').textContent = taskList.length;
    document.getElementById('statRunning').textContent = running;

    // Agents
    const agentGrid = document.getElementById('agentGrid');
    if (agentList.length === 0) {
      agentGrid.innerHTML = '<div class="empty-state">暂无 Agent</div>';
    } else {
      agentGrid.innerHTML = agentList.map(a => `
        <div class="agent-card">
          <div class="agent-header">
            <span class="agent-name">${esc(a.name)}</span>
            <span class="status-badge ${a.status}">${a.status === 'online' ? '在线' : '离线'}</span>
          </div>
          <div class="agent-meta">ID: ${a.id.slice(0, 8)}... | ${timeAgo(a.createdAt)}</div>
          <div class="capabilities">
            ${(a.capabilities || []).map(c => `<span class="cap-tag">${esc(c)}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    // Tasks
    const taskContainer = document.getElementById('taskContainer');
    if (taskList.length === 0) {
      taskContainer.innerHTML = '<div class="empty-state" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;">暂无任务</div>';
    } else {
      taskContainer.innerHTML = `
        <table class="task-table">
          <thead><tr>
            <th>标题</th><th>状态</th><th>优先级</th><th>创建者</th><th>执行者</th><th>时间</th>
          </tr></thead>
          <tbody>
            ${taskList.map(t => `<tr>
              <td>${esc(t.title)}</td>
              <td><span class="task-status ${t.status}">${t.status}</span></td>
              <td>${t.priority}</td>
              <td>${esc((t.createdBy || '').slice(0, 8))}...</td>
              <td>${t.assignedTo ? esc(t.assignedTo.slice(0, 8)) + '...' : '-'}</td>
              <td>${timeAgo(t.createdAt)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }

    // Messages
    const msgListEl = document.getElementById('msgList');
    if (msgList.length === 0) {
      msgListEl.innerHTML = '<div class="empty-state">暂无消息</div>';
    } else {
      msgListEl.innerHTML = msgList.map(m => `
        <div class="msg-item">
          <div class="msg-header">
            <span class="msg-from">${esc((m.fromAgent || '').slice(0, 8))}...${m.toAgent ? ' → ' + esc(m.toAgent.slice(0, 8)) + '...' : ''}</span>
            <span class="msg-time">${timeAgo(m.createdAt)}</span>
          </div>
          <div class="msg-content">${esc(typeof m.content === 'string' ? m.content : JSON.stringify(m.content))}</div>
        </div>
      `).join('');
    }

    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    console.error('Refresh failed:', e);
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  return Math.floor(diff / 86400000) + ' 天前';
}

// Init
document.getElementById('tokenInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
if (TOKEN) loadDashboard();
</script>
</body>
</html>
